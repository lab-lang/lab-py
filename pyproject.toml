[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lab-python"
version = "0.1.0"
description = "A small Python compiler for inspectable laboratory protocols"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pint>=0.24,<0.27"]

[project.optional-dependencies]
opentrons = ["opentrons==8.8.2"]
star = ["pylabrobot==0.2.1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "xlsxwriter>=3.2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires the optional robot SDKs; never connects to hardware"]

[tool.mypy]
files = ["src/lab"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["opentrons.*", "pylabrobot.*"]
ignore_missing_imports = true
